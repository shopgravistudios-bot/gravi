# Baut Locker für Mac (Apple Silicon + Intel) und Windows.
# Start: Tab "Actions" -> "Build Locker" -> "Run workflow", oder ein Tag wie v0.1.0 pushen.
# Ergebnis: Entwurf unter "Releases" mit .dmg und .msi zum Herunterladen.
name: Build Locker

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Kopier-Kern testen
        run: cargo test -p locker-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'locker-v__VERSION__' }}
          releaseName: "Locker v__VERSION__"
          releaseBody: "Mac: .dmg öffnen, Locker in Programme ziehen. Beim ersten Start Rechtsklick > Öffnen."
          releaseDraft: true
          args: ${{ matrix.args }}
