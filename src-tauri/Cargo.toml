[package]
name = "locker"
version = "0.1.0"
description = "Locker: Karten sicher auf die Platte bringen"
edition = "2021"

[lib]
name = "locker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
locker-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
